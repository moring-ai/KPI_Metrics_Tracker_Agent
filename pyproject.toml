[project]
name = "kpi-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.90",
    "mcp>=2.2.0",
    "requests>=2.34.2",
    "slack-sdk>=3.44.1",
]

[project.optional-dependencies]
# Only the AgentCore deployment needs these. The EC2 deployment runs the same
# kpi_tracker code without LangGraph, so they stay out of the base install.
#   pip install -e ".[agentcore]"
agentcore = [
  "langgraph~=1.0",
  "langchain~=1.3",
  "langchain-openai~=1.1",
  "langchain-mcp-adapters~=0.3.0",
  "bedrock-agentcore~=1.18",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "responses>=0.26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/aicp and src/agent are NOT listed: the AICP image sets
# PYTHONPATH=/app/src:/app, so they import without being installed. That
# matches how the platform template expects a repo to be laid out.
packages = ["kpi_tracker", "kpi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The AgentCore graph tests are async (LangGraph nodes are), matching the AICP
# template's own convention. Everything else stays synchronous.
asyncio_mode = "auto"

[project.scripts]
kpi-tracker = "kpi_tracker.cli:main"
kpi-linkedin-mcp = "kpi_mcp.linkedin_server:main"
kpi-slack-mcp = "kpi_mcp.slack_server:main"
